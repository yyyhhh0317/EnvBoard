# v0.2.0 测试用 pyproject.toml
# 验证：Poetry / PEP 621 格式解析
# 使用方法：上传此文件，应识别为 poetry 类型并展示依赖分组

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "envboard-backend"
version = "0.3.0"
description = "EnvBoard 后端服务（测试用）"
authors = ["yyyhhh0317 <test@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
# Web 框架
fastapi = "0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
# 数据库
sqlalchemy = "^2.0.34"
psycopg2-binary = ">=2.9.9"
redis = "^5.0.8"
# 数据处理
pydantic = "^2.8"
python-dateutil = ">=2.9.0"

[tool.poetry.group.dev.dependencies]
# 测试
pytest = "^8.3.0"
pytest-cov = ">=5.0.0"
# 代码质量
black = "24.8.0"
mypy = "~1.11"
ruff = ">=0.6.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = ">=9.5.0"
